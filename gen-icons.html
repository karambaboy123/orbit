<!DOCTYPE html>
<html>
<head><title>Orbit Icon Generator</title></head>
<body style="font-family:sans-serif;padding:30px;background:#f1f5f9">
<h2>Orbit Icon Generator</h2>
<p>Klik op de knoppen om de icons te downloaden, stuur ze daarna terug.</p>
<canvas id="c" style="display:none"></canvas>
<div style="display:flex;gap:16px;margin-top:20px">
  <div>
    <canvas id="prev192" width="192" height="192" style="border-radius:36px;display:block"></canvas>
    <button onclick="dl(192)" style="margin-top:8px;padding:8px 16px;background:#4f46e5;color:white;border:none;border-radius:6px;cursor:pointer">Download 192×192</button>
  </div>
  <div>
    <canvas id="prev512" width="512" height="512" style="border-radius:96px;display:block;width:128px;height:128px"></canvas>
    <button onclick="dl(512)" style="margin-top:8px;padding:8px 16px;background:#4f46e5;color:white;border:none;border-radius:6px;cursor:pointer">Download 512×512</button>
  </div>
</div>
<script>
function drawOrbit(ctx, size) {
  const s = size / 100;
  const r = size * 0.14; // border radius proportional

  // Background
  ctx.fillStyle = '#312e81';
  roundRect(ctx, 0, 0, size, size, size * 0.215);
  ctx.fill();

  ctx.save();
  ctx.translate(size * 0.13, size * 0.13);
  ctx.scale(s * 0.74, s * 0.74);

  ctx.strokeStyle = 'white';
  ctx.lineCap = 'round';

  // Back arc (behind circle)
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 4;
  ctx.beginPath();
  // Arc: M 88 23 A 47 13 -35 0 0 12 77
  drawArc(ctx, 88, 23, 47, 13, -35, false);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Main ring (the O)
  ctx.lineWidth = 10.5;
  ctx.beginPath();
  ctx.arc(50, 50, 31, 0, Math.PI * 2);
  ctx.stroke();

  // Front arc (in front of circle)
  ctx.lineWidth = 4;
  ctx.beginPath();
  drawArc(ctx, 88, 23, 47, 13, -35, true);
  ctx.stroke();

  // Big dot bottom-left
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(12, 77, 8, 0, Math.PI * 2);
  ctx.fill();

  // Small dot top-right
  ctx.beginPath();
  ctx.arc(88, 23, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawArc(ctx, x1, y1, rx, ry, angle, front) {
  // Approximate the SVG arc with canvas ellipse
  const rad = angle * Math.PI / 180;
  ctx.save();
  ctx.translate(50, 50);
  ctx.rotate(rad);
  ctx.scale(1, ry/rx);
  ctx.arc(0, 0, rx, Math.atan2((y1-50)/( ry/rx), (x1-50)) - 0.01, Math.atan2((y1-50)/(ry/rx), (x1-50)) + Math.PI + 0.01, !front);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Use SVG image drawn to canvas for pixel-perfect result
function drawFromSVG(size, canvasId) {
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
    <rect width="512" height="512" rx="110" fill="#312e81"/>
    <g transform="translate(66,66) scale(3.8)">
      <path d="M 88 23 A 47 13 -35 0 0 12 77" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="50" cy="50" r="31" fill="none" stroke="white" stroke-width="10.5"/>
      <path d="M 88 23 A 47 13 -35 0 1 12 77" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <circle cx="12" cy="77" r="8" fill="white"/>
      <circle cx="88" cy="23" r="5" fill="white"/>
    </g>
  </svg>`;
  const blob = new Blob([svgStr], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const cv = document.getElementById(canvasId);
    cv.width = size; cv.height = size;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function dl(size) {
  const id = 'prev' + size;
  const cv = document.getElementById(id);
  const a = document.createElement('a');
  a.download = 'icon-' + size + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}

drawFromSVG(192, 'prev192');
drawFromSVG(512, 'prev512');
</script>
</body>
</html>
